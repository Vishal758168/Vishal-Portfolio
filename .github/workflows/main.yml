name: Deploy Portfolio to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2️⃣ Build Docker image (optional)
      - name: Build Docker image
        run: docker build -t vishal-portfolio .

      # 3️⃣ Deploy to EC2 via SSH
      - name: Copy files to EC2
        uses: appleboy/ssh-action@v0.1.9
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            sudo docker pull vishal-portfolio || echo "Image not found, building..."
            sudo docker stop portfolio || true
            sudo docker rm portfolio || true
            sudo docker run -d --name portfolio -p 80:80 vishal-portfolio

