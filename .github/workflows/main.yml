name: Deploy to EC2

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout repository
    - name: Checkout Repository
      uses: actions/checkout@v3

    # Step 2: Copy files to EC2
    - name: Copy files to EC2
      run: |
        scp -i ${{ secrets.EC2_KEY }} -r ./ ubuntu@${{ secrets.EC2_HOST }}:/home/ubuntu/portfolio

    # Step 3: SSH into EC2 and deploy Docker
    - name: Build and Run Docker on EC2
      uses: appleboy/ssh-action@v0.1.6
      with:
        host: ${{ secrets.EC2_HOST }}
        username: ubuntu
        key: ${{ secrets.EC2_KEY }}
        port: 22
        script: |
          cd /home/ubuntu/portfolio
          docker build -t portfolio:latest .
          docker stop portfolio || true
          docker rm portfolio || true
          docker run -d --name portfolio -p 80:80 portfolio:latest
