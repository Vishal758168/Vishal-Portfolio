name: Deploy Portfolio to EC2 (No DockerHub)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy on EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~
            if [ ! -d "Vishal-Portfolio" ]; then
              git clone https://github.com/Vishal758168/https://github.com/Vishal758168/Vishal-Portfolio.git
            fi

            cd Vishal-Portfolio
            git pull origin main

            sudo docker stop portfolio || true
            sudo docker rm portfolio || true
            sudo docker rmi portfolio:latest || true

            sudo docker build -t portfolio:latest .
            sudo docker run -d --name portfolio -p 80:80 portfolio:latest
